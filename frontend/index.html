<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VitrineRondon: vitrine digital para microempreendedores da sua cidade. Encontre produtos e serviços feitos por quem mora perto de você."
    />
    <!-- As fotos dos negócios vêm do Cloudinary: a conexão já começa aberta -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- As fontes saem do próprio site (src/fontes.css). Sem elas no Google, a
         primeira pintura não espera mais duas requisições de CSS de fora. -->
    <!-- fontes:inicio (gerado por scripts/baixar-fontes.mjs) -->
    <link rel="preload" href="/fontes/texto-latin-a79fdb52d4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fontes/texto-latin-3100e775e8.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fontes/icones-743e1665c9.woff2" as="font" type="font/woff2" crossorigin />
    <!-- fontes:fim -->
    <title>VitrineRondon</title>

    <!-- Abertura da primeira visita: fica no HTML (e não no React) para aparecer
         no primeiro instante, antes de o JavaScript chegar. Na mesma sessão,
         a próxima visita já começa sem ela. O main.jsx a retira. -->
    <script src="/abertura.js"></script>
    <style>
      .abertura {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle 520px at 50% 45%, #1e3a8a, transparent), #0b1b45;
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .sem-abertura .abertura {
        display: none;
      }
      .abertura--saindo {
        transform: translateY(-100%);
        pointer-events: none;
      }
      .abertura__miolo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .abertura--saindo .abertura__miolo {
        opacity: 0;
        transform: translateY(-30px);
      }
      .abertura__marca {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        animation: abertura-entra 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .abertura__logo {
        width: clamp(64px, 14vw, 92px);
        height: auto;
        filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35));
      }
      .abertura__nome {
        font-family: 'Bricolage Grotesque', 'Arial Black', Impact, sans-serif;
        font-weight: 800;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }
      .abertura__nome b {
        font-weight: inherit;
        color: #fbbf24;
      }
      .abertura__barra {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .abertura__barra > span {
        display: block;
        height: 100%;
        width: 0;
        background: #fbbf24;
        box-shadow: 0 0 12px #fbbf24;
        animation: abertura-barra 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .abertura__rotulo {
        margin: 0;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      @keyframes abertura-barra {
        to {
          width: 100%;
        }
      }
      @keyframes abertura-entra {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }
      /* Menos movimento: sem a cortina, a abertura só esmaece */
      @media (prefers-reduced-motion: reduce) {
        .abertura {
          transition: opacity 0.3s ease;
        }
        .abertura--saindo {
          transform: none;
          opacity: 0;
        }
        .abertura__marca,
        .abertura__barra > span {
          animation: none;
        }
        .abertura__barra > span {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="abertura" class="abertura" aria-hidden="true">
      <div class="abertura__miolo">
        <div class="abertura__marca">
          <img class="abertura__logo" src="/src/assets/logo.svg" alt="" width="92" height="71" />
          <span class="abertura__nome">Vitrine<b>Rondon</b></span>
        </div>
        <div class="abertura__barra"><span></span></div>
        <p class="abertura__rotulo">// vitrinerondon · carregando</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
